<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="common.css"><title>Дроби · Как поделить школьный сад?</title><style>.strip{height:72px;display:flex;border:2px solid #173e3b;border-radius:10px;overflow:hidden;margin:14px 0}.piece{flex:1;border-right:2px solid white;display:flex;align-items:center;justify-content:center;background:#eef2e8}.piece:last-child{border:0}.piece.filled{background:#fcc900}.stages{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.stages button{font-size:12px;padding:8px}.equation{font-size:34px;font-weight:750}.choices button{min-width:80px}</style><main><header><div><div class="kicker">Математика · 5 класс · 45 минут</div><h1>Как поделить школьный сад?</h1></div><span class="badge">Одна площадь — разные дроби</span></header><nav class="stages" id="stages"></nav><div id="body"></div><footer>Авторский сценарий по теме «Обыкновенные дроби» ФРП математики 5–9 классов. Целые на рисунках одинакового размера.</footer></main><script>
const $=x=>document.getElementById(x);let stage=0;const titles=['1. Вопрос · 5 мин','2. Исследование · 8 мин','3. Объяснение · 7 мин','4. Практика · 12 мин','5. Найди ошибку · 8 мин','6. Выходной билет · 5 мин'];function strip(id,a,b){$(id).innerHTML=Array.from({length:b},(_,i)=>`<div class="piece ${i<a?'filled':''}">${i<a?'✦':''}</div>`).join('')}function bars(){let a=+$('num').value,b=+$('den').value;if(a>b){a=b;$('num').value=a}$('num').max=b;const k=+$('factor').value;strip('a',a,b);strip('b',a*k,b*k);$('eq').textContent=`${a}/${b} = ${a*k}/${b*k}`;$('values').textContent=`Закрашено ${a} из ${b} равных частей. Каждую часть разделили ещё на ${k}. Площадь не изменилась.`}function render(){document.querySelectorAll('#stages button').forEach((b,i)=>b.classList.toggle('active',stage===i));const content=[`<div class="cols"><article class="card"><h2>Три команды получили грядки</h2><p>Первая засадила 1/2 своей грядки, вторая — 2/4, третья — 3/6.</p><p>Все грядки одинаковые. Какая команда засадила больше?</p><div class="row choices"><button onclick="answer(false)">Первая</button><button onclick="answer(false)">Третья</button><button onclick="answer(true)">Поровну</button></div><p id="feedback" class="feedback">Сначала предположение, затем проверка рисунком.</p></article><article class="card"><h2>Проверьте глазами</h2><div id="x1" class="strip"></div><div id="x2" class="strip"></div><div id="x3" class="strip"></div></article></div>`,`<div class="cols"><article class="card"><h2>Разделите каждую часть ещё раз</h2><div class="equation" id="eq"></div><div class="strip" id="a"></div><div class="strip" id="b"></div><p id="values"></p></article><article class="card"><label>Числитель <input id="num" type="range" min="1" max="4" value="2"></label><p><label>Знаменатель <input id="den" type="range" min="2" max="8" value="4"></label></p><p><label>Делим каждую часть на <select id="factor"><option>2</option><option>3</option></select></label></p><p class="feedback">Предскажите результат до изменения ползунка. Почему площадь осталась прежней?</p></article></div>`,`<div class="card"><h2>Основное свойство дроби</h2><div class="equation">1/2 = 2/4 = 3/6</div><p>Если числитель и знаменатель умножить на одно и то же ненулевое натуральное число, значение дроби не изменится.</p><p>В рисунке это означает: каждую часть дробим одинаково, закрашенную площадь сохраняем.</p><div class="feedback">Важно: сравниваем доли одинакового целого. Половина маленькой грядки не обязана быть равна половине большой.</div></div>`,`<div class="cols"><div class="card"><h2>Заполните пропуск</h2><div class="equation">2/3 = ?/6</div><p>Знаменатель увеличился в 2 раза. Что должно произойти с числителем?</p><div class="row choices"><button onclick="answer(false)">2</button><button onclick="answer(true)">4</button><button onclick="answer(false)">6</button></div><p id="feedback" class="feedback">Выберите число и объясните ход рассуждения.</p></div><div class="card"><h2>Работа в парах</h2><p>База: нарисуйте 1/3 и 2/6.</p><p>Продолжение: найдите две дроби, равные 3/4.</p><p>Исследование: придумайте случай, когда одинаковые дроби означают разную площадь.</p><p class="muted">Критерий: правильное равенство + рисунок + объяснение про одинаковое целое.</p></div></div>`,`<div class="card"><h2>ИИ ответил уверенно. А верно ли?</h2><div class="equation">«1/8 больше 1/4, ведь 8 больше 4»</div><p>Один и тот же участок делят на 4 или на 8 равных частей. Какая отдельная часть больше?</p><div class="row"><button onclick="answer(true)">1/4 больше: частей меньше</button><button onclick="answer(false)">ИИ прав</button></div><p id="feedback" class="feedback">Это специально составленный ошибочный ответ для проверки, а не цитата из модели.</p></div>`,`<div class="cols"><div class="card"><h2>Выходной билет</h2><p>1. Дайте дробь, равную 1/2.</p><p>2. Объясните, почему 2/4 = 1/2.</p><p>3. Что нужно знать о целом, сравнивая части двух грядок?</p><button onclick="document.getElementById('keys').hidden=false">Показать критерии</button><p id="keys" hidden>Например, 3/6; каждую половину разделили на две части; целые должны быть одинакового размера. По 1 баллу за каждый ответ.</p></div><div class="card"><h2>Смысл важнее движения ползунка</h2><p>Ученик не просто увидел дробь. Он выдвинул гипотезу, проверил её и объяснил, что осталось неизменным.</p><a href="../index.html#lesson">План урока и полный промпт →</a></div></div>`];$('body').innerHTML=content[stage];if(stage===0){strip('x1',1,2);strip('x2',2,4);strip('x3',3,6)}if(stage===1){['num','den','factor'].forEach(id=>$(id).oninput=bars);bars()}}function answer(ok){$('feedback').textContent=ok?'Верно! Теперь объясните ответ соседу по парте.':'Проверьте ещё раз: сравнивайте части одинакового целого.'}titles.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{stage=i;render()};$('stages').append(b)});render();
</script></html>
